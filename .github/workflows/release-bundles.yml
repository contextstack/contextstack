# Publish install bundles directly to GitHub Releases.
name: Release bundles

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          stable="^v$core\.$core\.$core$"
          pre="^v$core\.$core\.$core-$identifier(\.$identifier)*$"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo '::error::Release publishing requires a semver tag' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ $stable ]]; then
            echo 'RELEASE_CHANNEL=stable' >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" =~ $pre ]]; then
            echo 'RELEASE_CHANNEL=latest' >> "$GITHUB_ENV"
          else
            echo '::error::Invalid release tag; expected vMAJOR.MINOR.PATCH or a semver prerelease' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::Tagged commit is not reachable from main; refusing release' >&2
            exit 1
          fi

      - name: Verify release is listed on main RELEASES.json
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          tag = os.environ["GITHUB_REF_NAME"]
          commit = os.environ["GITHUB_SHA"]
          manifest = json.loads(subprocess.check_output(
              ["git", "show", "origin/main:RELEASES.json"], text=True))
          for item in manifest.get("releases") or []:
              if item.get("tag") == tag and item.get("commit") == commit:
                  sys.exit(0)
          print(f"::error::{tag} at {commit} is not listed in RELEASES.json on main", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Install the pinned Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show

      - name: Install uv
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: cs/.python-version

      - name: Build the bundle
        run: |
          python3 cs/scripts/node-bundle build \
            --target "${{ matrix.target }}" \
            --director-rs \
            --release-version "$GITHUB_REF_NAME" \
            --publish-dir "${{ runner.temp }}/publish" \
            --channel "$RELEASE_CHANNEL" \
            "${{ runner.temp }}/bundle"

      - name: Sign and notarize the macOS bundle
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          python3 .github/scripts/sign-macos-bundle.py "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/publish" "$RELEASE_CHANNEL"

      - name: Delete temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/contextstack-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/contextstack-signing.keychain-db"
          fi

      - name: Upload the tarball and checksum
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/publish/*.tar.gz
            ${{ runner.temp }}/publish/*.sha256
            ${{ runner.temp }}/publish/*.json

  merge:
    name: Merge channel manifests
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          core='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          stable="^v$core\.$core\.$core$"
          pre="^v$core\.$core\.$core-$identifier(\.$identifier)*$"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo '::error::Release publishing requires a semver tag' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ $stable ]]; then
            echo 'RELEASE_CHANNEL=stable' >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" =~ $pre ]]; then
            echo 'RELEASE_CHANNEL=latest' >> "$GITHUB_ENV"
          else
            echo '::error::Invalid release tag; expected vMAJOR.MINOR.PATCH or a semver prerelease' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::Tagged commit is not reachable from main; refusing release' >&2
            exit 1
          fi

      - name: Verify release is listed on main RELEASES.json
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys
          tag = os.environ["GITHUB_REF_NAME"]
          commit = os.environ["GITHUB_SHA"]
          manifest = json.loads(subprocess.check_output(
              ["git", "show", "origin/main:RELEASES.json"], text=True))
          for item in manifest.get("releases") or []:
              if item.get("tag") == tag and item.get("commit") == commit:
                  sys.exit(0)
          print(f"::error::{tag} at {commit} is not listed in RELEASES.json on main", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Download bundle artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: bundle-*
          path: artifacts

      - name: Merge channel manifests
        run: |
          python3 cs/scripts/node_publish.py merge \
            "$RELEASE_CHANNEL" \
            "${{ runner.temp }}/channel" \
            artifacts/bundle-macos-aarch64 \
            artifacts/bundle-linux-x86_64 \
            artifacts/bundle-linux-aarch64

      - name: Upload the merged channel manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: channel-manifest
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/channel/*.json
            ${{ runner.temp }}/channel/*.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(cs/scripts/install.sh artifacts/bundle-*/*.tar.gz artifacts/bundle-*/*.sha256 "${{ runner.temp }}/channel/$RELEASE_CHANNEL.json" "${{ runner.temp }}/channel/$RELEASE_CHANNEL.txt")
          if [ "$RELEASE_CHANNEL" = latest ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --latest=false --title "$GITHUB_REF_NAME" --notes-file docs/release/prerelease-notes.md --generate-notes "${assets[@]}"
            # The preview channel is separate from GitHub stable latest.
            if gh release view channel-latest >/dev/null 2>&1; then
              gh release delete channel-latest --yes --cleanup-tag
            fi
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/channel-latest" -f sha="$GITHUB_SHA" -F force=true || \
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/channel-latest -f sha="$GITHUB_SHA"
            gh release create channel-latest --target "$GITHUB_SHA" --prerelease --latest=false --title "Latest" --notes-file docs/release/prerelease-notes.md "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=true --title "$GITHUB_REF_NAME" --generate-notes "${assets[@]}"
          fi
