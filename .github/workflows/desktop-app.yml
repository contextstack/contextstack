name: Desktop app

"on":
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: clients/web
    env:
      NATIVEPHP_UPDATER_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install application
        env:
          COMPOSER_AUTH: ${{ secrets.FLUX_COMPOSER_AUTH }}
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --no-interaction
          npm ci
          npm run build
          php artisan native:install --no-interaction
          electron=vendor/nativephp/desktop/resources/electron/node_modules/electron
          if [ ! -d "$electron/dist" ]; then
            (cd "$electron" && node install.js)
          fi
      - name: Configure version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            echo "NATIVEPHP_APP_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - name: Import signing certificate into a temporary keychain
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing signing certificate}" "${CSC_KEY_PASSWORD:?Missing certificate password}"
          umask 077
          keychain="$RUNNER_TEMP/desktop-signing.keychain-db"
          cert="$RUNNER_TEMP/desktop-cert.p12"
          password=$(openssl rand -hex 24)
          python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["CSC_LINK"], validate=True))' "$cert"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # Searched by codesign and by electron-builder during native:build; scripts/build-desktop signs from it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, sign and notarize (scripts/build-desktop)
        env:
          COMPOSER_AUTH: ${{ secrets.FLUX_COMPOSER_AUTH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing team ID}" "${ASC_KEY_ID:?Missing API key ID}" "${ASC_ISSUER_ID:?Missing issuer ID}" "${ASC_KEY_P8_BASE64:?Missing API key}"
          umask 077
          key="$RUNNER_TEMP/desktop-notary.p8"
          python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["ASC_KEY_P8_BASE64"], validate=True))' "$key"
          chmod 600 "$key"
          # Release .env, eight PHP workers, re-signing from CODESIGN_KEYCHAIN, the .dmg and .zip, notarization
          # with the API key and stapling: see clients/web/README.md, "Desktop release".
          NOTARY_KEY="$key" NOTARY_KEY_ID="$ASC_KEY_ID" NOTARY_ISSUER="$ASC_ISSUER_ID" scripts/build-desktop arm64
      - name: Verify signature, notarization and workers
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          app=nativephp/electron/dist/mac-arm64/ContextStack.app
          dmgs=(nativephp/electron/dist/release/*.dmg)
          zips=(nativephp/electron/dist/release/*.zip)
          [ -d "$app" ] && [ "${#dmgs[@]}" -eq 1 ] && [ "${#zips[@]}" -eq 1 ]
          dmg="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2> "$RUNNER_TEMP/desktop-signature.txt"
          grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/desktop-signature.txt"
          grep -E 'flags=.*runtime' "$RUNNER_TEMP/desktop-signature.txt"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/desktop-spctl.txt"
          grep -F 'accepted' "$RUNNER_TEMP/desktop-spctl.txt"
          grep -F 'source=Notarized Developer ID' "$RUNNER_TEMP/desktop-spctl.txt"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSEnvironment:PHP_CLI_SERVER_WORKERS' "$app/Contents/Info.plist")" = 8 ]
      - name: Delete temporary notarization key and keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/desktop-notary.p8" "$RUNNER_TEMP/desktop-cert.p12"
          if [ -n "${CODESIGN_KEYCHAIN:-}" ]; then security delete-keychain "$CODESIGN_KEYCHAIN" || true; fi
      - name: Upload signed DMG and zip
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-macos-arm64
          if-no-files-found: error
          path: |
            clients/web/nativephp/electron/dist/release/*.dmg
            clients/web/nativephp/electron/dist/release/*.zip
      - name: Attach to GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "ContextStack desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" nativephp/electron/dist/release/*.dmg nativephp/electron/dist/release/*.zip --clobber
