[workspace]
members = ["browser-host", "director", "gateway", "harness", "harness/http-client", "sandbox", "sandbox/child-signals", "sandbox/landlock", "tools"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
cs-child-signals = { path = "sandbox/child-signals" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cs-http-client = { path = "harness/http-client" }
hex = "0.4"
libyaml-safer = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "process", "signal", "time", "net", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = { level = "allow", priority = 1 } # Names remain clear at their module boundary.
must_use_candidate = { level = "allow", priority = 1 } # Avoid annotations on every accessor.
missing_errors_doc = { level = "allow", priority = 1 } # Internal errors are carried by the wire-compatible text contract.

[profile.release]
lto = "thin"
strip = true
