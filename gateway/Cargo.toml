[package]
name = "cs-gateway"
description = "The ContextStack model gateway: every model, API and coding-agent CLI behind one door"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cs-gateway"
path = "src/main.rs"

[dependencies]
cs-child-signals.workspace = true
bytes = "1"
chrono.workspace = true
cs-http-client.workspace = true
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "tokio"] }
reqwest.workspace = true
rustix = { version = "1.1", features = ["fs", "process", "system"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
tokio-util.workspace = true

[lints]
workspace = true
